name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@^11.5.1 # OIDC trusted publishing needs npm >=11.5.1; avoid floating @latest (12.x needs Node >=22.22.2/24.15/26)

      - run: npm run test
      - run: npm run check
      - run: npm publish --provenance --access public
